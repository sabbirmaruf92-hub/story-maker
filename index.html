<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Story Maker</title>
<style>
body{margin:0;background:#0b0b14;color:#eee;font-family:system-ui,sans-serif;text-align:center}
canvas{width:100%;max-width:960px;aspect-ratio:16/9;background:#000;display:block;margin:0 auto}
.bar{padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
button,select,#dl{font-size:16px;padding:10px 14px;border-radius:10px;border:0;background:#d4af37;color:#111;font-weight:700;text-decoration:none}
input[type=range]{width:92%;max-width:900px}
#msg{font-size:14px;padding:6px;color:#bbb}#dl{display:none}
</style></head><body>
<canvas id="c" width="1280" height="720"></canvas>
<input type="range" id="seek" min="0" max="1000" value="0">
<div class="bar">
<button id="bp">▶ Play</button><button id="br">⏮ Restart</button>
<select id="st"></select>
<button id="bm">🎵 Music: On</button><button id="be">🎬 Export video</button>
</div>
<div class="bar"><a id="dl"></a></div>
<div id="msg">Tap Play to start.</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=1280,H=720,GY=560,$=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),lerp=(a,b,k)=>a+(b-a)*k,ease=k=>k*k*(3-2*k);
const seg=(t,a,b)=>clamp((t-a)/(b-a)),es=(t,a,b)=>ease(seg(t,a,b));
const mixc=(a,b,k,al=1)=>`rgba(${a.map((v,i)=>Math.round(lerp(v,b[i],k))).join()},${al})`;
const rnd=i=>{const x=Math.sin(i*127.1)*43758.5;return x-Math.floor(x)};
function rg(x,y,r,c0,c1,x2=x,y2=y){const g=ctx.createRadialGradient(x2,y2,0,x,y,r);g.addColorStop(0,c0);g.addColorStop(1,c1);return g}
function el(x,y,rx,ry,f,rot=0){ctx.beginPath();ctx.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),rot,0,7);ctx.fillStyle=f;ctx.fill()}
let T=0;
function char(o){
 const s=o.s||1,lk=o.look||[0,0],md=o.mood||0,bl=o.blink||0,wk=o.walk||0,c=o.col,d=o.dark,lift=o.lift||0;
 const bob=o.moving?Math.abs(Math.sin(wk))*9:Math.sin(T*3)*2;let hand;
 ctx.save();ctx.translate(o.x,o.y);ctx.scale(s,s);
 el(0,lift+2,80-lift*.3,16,'rgba(0,0,0,.3)');
 for(const i of[-1,1]){const a=o.moving?Math.sin(wk+(i>0?0:Math.PI))*.55:0;
  ctx.save();ctx.translate(i*26,-62-bob);ctx.rotate(a);el(0,26,13,30,d);el(i*4,52,22,12,d);ctx.restore()}
 el(0,-100-bob,62,56,rg(0,-100-bob,70,c,d,-20,-125-bob));el(0,-92-bob,36,32,'rgba(255,255,255,.18)');
 for(const i of[-1,1]){const a=i<0?o.aL:o.aR,sx=i*56,sy=-108-bob,ex=sx+i*Math.sin(a)*54,ey=sy+Math.cos(a)*54;
  ctx.lineCap='round';ctx.strokeStyle=c;ctx.lineWidth=24;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
  el(ex,ey,15,15,rg(ex,ey,15,c,d,ex-4,ey-4));if(i>0)hand=[o.x+ex*s,o.y+ey*s]}
 ctx.save();ctx.translate(0,-188-bob);ctx.rotate(o.tilt||0);
 if(o.ears)for(const i of[-1,1]){el(i*40,-85,15,40,c,i*.3);el(i*40,-85,7,26,'#ffb3c1',i*.3)}
 el(0,0,84,74,rg(0,0,100,c,d,-28,-34));
 for(const i of[-1,1]){const ex=i*32,ey=4,op=(1-bl)*(md==2?.6:1);
  el(ex,ey,19,25*op,'#fff');const px=ex+lk[0]*7,py=ey+lk[1]*8;el(px,py,11,14*op,'#1b1230');el(px-4,py-5,4,4*op,'#fff');
  const iy=md==1?-38:md==2?-42:-34,oy=md==1?-26:md==2?-42:-34;
  ctx.strokeStyle='#2a1a3a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(ex-i*14,iy);ctx.lineTo(ex+i*14,oy);ctx.stroke();
  el(i*54,26,13,8,'rgba(255,110,130,.45)');
  if(o.cry)el(ex,32+(T*70+i*9)%36,5,8,'rgba(140,210,255,.8)')}
 ctx.strokeStyle='#5a1f3a';ctx.lineWidth=5;ctx.beginPath();
 if(md==0){ctx.arc(0,34,12,.2,Math.PI-.2);ctx.stroke()}
 else if(md==1){ctx.arc(0,54,12,Math.PI+.3,-.3);ctx.stroke()}
 else{ctx.arc(0,32,22,.05,Math.PI-.05);ctx.closePath();ctx.fillStyle='#7a1f3a';ctx.fill();el(0,50,10,6,'#ff7a8a')}
 ctx.restore();ctx.restore();return hand}
function glow(x,y,r,a,core){const g=ctx.globalCompositeOperation;ctx.globalCompositeOperation='lighter';
 el(x,y,r,r,rg(x,y,r,`rgba(255,215,110,${a})`,'rgba(255,190,70,0)'));ctx.globalCompositeOperation=g;
 if(core)el(x,y,core,core,rg(x,y,core,'#fff','#ffd76a'))}
const D1=26;
function littleLight(t){
 T=t;const L=.12+.88*es(t,14.5,22),z=1+.12*es(t,9,13)-.12*es(t,17,22);
 ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(780,430);ctx.scale(z,z);ctx.translate(-780,-430);
 let g=ctx.createLinearGradient(0,0,0,GY);g.addColorStop(0,mixc([8,10,36],[255,160,120],L));g.addColorStop(1,mixc([30,36,80],[255,226,170],L));
 ctx.fillStyle=g;ctx.fillRect(-200,-200,W+400,H+400);
 for(let i=0;i<60;i++)el(rnd(i)*W,rnd(i+9)*380,2,2,`rgba(255,255,230,${(1-L)*(.5+.5*Math.sin(t*2+i))})`);
 el(1050,120,46,46,`rgba(255,250,220,${.9*(1-L)})`);
 el(640,GY-20,520,260,rg(640,GY-20,520,`rgba(255,230,150,${L*L})`,'rgba(255,230,150,0)'));
 const mx=-130+510*es(t,0,5)+410*es(t,10,13.5),mv=(t>.01&&t<5)||(t>10&&t<13.5),wk=mx/38;
 for(let k=0;k<2;k++){ctx.beginPath();ctx.moveTo(-50,H);
  for(let x=-50;x<=W+50;x+=40)ctx.lineTo(x,GY-70-k*50+Math.sin(x*.004+k*2-mx*.0004*(k+1))*40);
  ctx.lineTo(W+50,H);ctx.fillStyle=mixc(k?[14,22,52]:[10,16,44],k?[110,170,120]:[80,150,110],L);ctx.fill()}
 for(let i=0;i<9;i++){const x=i*170+rnd(i)*70-mx*.05,tc=mixc([10,26,40],[50,130,80],L);
  ctx.fillStyle=mixc([30,20,30],[110,70,50],L);ctx.fillRect(x-8,GY-90,16,90);el(x,GY-150,50,70,tc);el(x,GY-195,36,48,tc)}
 ctx.fillStyle=mixc([12,22,40],[70,150,80],L);ctx.fillRect(-200,GY-10,W+400,H);
 const fg=es(t,17,22);for(let i=0;i<18;i++){const x=i*75+rnd(i+3)*40,y=GY+25+rnd(i+7)*110;
  ctx.strokeStyle='#3d8a4a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-22*fg);ctx.stroke();el(x,y-22*fg,7*fg,7*fg,i%2?'#ffd76a':'#ff9ec0')}
 const bl=(t%3.3)>3.18?1:0,jp=t>17?Math.abs(Math.sin((t-17)*4.5))*45*es(t,17,17.5):0,jq=t>17?Math.abs(Math.sin((t-17.3)*4.5))*35*es(t,17,17.5):0;
 const up=es(t,16.8,17.4),wv=2.5+Math.sin(t*8)*.3;
 const hP=char({x:960+(t<14?Math.sin(t*45)*2.5:0),y:GY-jq,lift:jq,s:.72,col:'#8ec5ff',dark:'#4f86e0',ears:1,blink:bl,tilt:.08,
  mood:t<14.5?1:2,cry:t<14.5,look:t<14.5?[-.4,.9]:[-.7,0],aL:lerp(.5,wv,up),aR:lerp(t<14?.6:1.3,wv,up)});
 const base=t<10?1:t<14?lerp(1,1.7,es(t,10,11.5)):lerp(1.7,.5,es(t,14,15.5));
 const hA=char({x:mx,y:GY-jp,lift:jp,s:1,col:'#ffb46b',dark:'#e07a3a',moving:mv,walk:wk,blink:bl,tilt:t<10?.08*Math.sin(t*2):0,
  mood:t<10?1:t<14?0:2,
  look:t<3?[Math.sin(t*2.2)*.9,-.1]:t<5?[.8,0]:t<8.2?[1,.3]:t<9.6?[.2,.9]:t<14?[1,.2]:[.8,-.3],
  aL:lerp(mv?.35+Math.sin(wk)*.5:.3,wv,up),aR:lerp(base,wv,up)});
 ctx.fillStyle=`rgba(4,6,28,${.55*(1-L)})`;ctx.fillRect(-200,-200,W+400,H+400);
 const pulse=1+.06*Math.sin(t*6);
 glow(hA[0]+8,hA[1]-28,(150+200*L)*pulse,.55,(20+8*L)*pulse);
 if(t>13.8){const k=es(t,13.8,16),bx=lerp(hA[0],hP[0],k)+ (k<1?0:0),by=lerp(hA[1],hP[1],k)-Math.sin(k*Math.PI)*90-28;
  glow(bx,by,(120+150*L)*pulse,.5,(16+7*L)*pulse)}
 for(let i=0;i<26;i++){const st=15+i*.3,a=es(t,st,st+1);if(a>0){
  const x=rnd(i)*W+Math.sin(t*1.3+i)*40,y=170+rnd(i+50)*330+Math.cos(t*1.7+i*2)*30,tw=.6+.4*Math.sin(t*5+i);
  glow(x,y,34*a,.6*tw*a,3*a)}}
 ctx.restore();
 g=ctx.createRadialGradient(W/2,H/2,H*.4,W/2,H/2,H*.95);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(t>22.5){const a=es(t,22.5,23.5);ctx.textAlign='center';ctx.font='bold 46px system-ui,sans-serif';ctx.fillStyle=`rgba(255,240,200,${a})`;
  ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=12;ctx.fillText('Sharing a little light',W/2,110);ctx.fillText('makes the whole world brighter.',W/2,168);ctx.shadowBlur=0}
 const f=Math.max(1-seg(t,0,.8),seg(t,D1-.8,D1));ctx.fillStyle=`rgba(0,0,0,${f})`;ctx.fillRect(0,0,W,H)}
const STORIES={'The Little Light':{D:D1,draw:littleLight}};
let cur=STORIES['The Little Light'],t=0,playing=false,last=0,rec=null,ac,dst,master,nodes=[],musicOn=true;
for(const k in STORIES)$('st').add(new Option(k,k));
function msg(s){$('msg').textContent=s}
function ensureAudio(){if(ac)return;ac=new(window.AudioContext||window.webkitAudioContext)();dst=ac.createMediaStreamDestination();master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);master.connect(dst)}
function note(f,at,len,v,type){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(v,at+.04);g.gain.exponentialRampToValueAtTime(.0001,at+len);
 o.connect(g);g.connect(master);o.start(at);o.stop(at+len+.05);nodes.push(o)}
function startMusic(from){stopMusic();if(!musicOn||!ac)return;const sc=[0,2,4,7,9],pat=[0,2,1,3,2,4,3,2],now=ac.currentTime+.05;
 for(let n=0;n*.5<cur.D;n++){const tm=n*.5;if(tm<from)continue;const v=.05+.07*es(tm,14,22),i=pat[n%8]+(tm>14.5?5:0);
  note(261.63*Math.pow(2,sc[i%5]/12+Math.floor(i/5)),now+tm-from,.9,v,'triangle');
  if(n%4==0)note(130.81*(tm>14.5?1.5:1),now+tm-from,2,.06,'sine')}}
function stopMusic(){nodes.forEach(o=>{try{o.stop()}catch(e){}});nodes=[]}
function play(){if(t>=cur.D-.01)t=0;ensureAudio();ac.resume();playing=true;last=performance.now();startMusic(t);$('bp').textContent='⏸ Pause'}
function pause(){playing=false;stopMusic();$('bp').textContent='▶ Play'}
function finish(){t=cur.D-.001;pause();if(rec){const r=rec;setTimeout(()=>r.stop(),400)}}
function tick(now){if(playing){t+=(now-last)/1000;if(t>=cur.D)finish()}last=now;cur.draw(t);$('seek').value=t/cur.D*1000;requestAnimationFrame(tick)}
$('bp').onclick=()=>playing?pause():play();
$('br').onclick=()=>{t=0;play()};
$('seek').oninput=e=>{t=e.target.value/1000*cur.D;if(playing)startMusic(t)};
$('st').onchange=e=>{cur=STORIES[e.target.value];t=0;pause()};
$('bm').onclick=()=>{musicOn=!musicOn;$('bm').textContent='🎵 Music: '+(musicOn?'On':'Off');if(playing)startMusic(t)};
$('be').onclick=()=>{
 if(!window.MediaRecorder||!cv.captureStream){msg('This browser cannot record video. Please use Chrome.');return}
 pause();t=0;ensureAudio();const stream=cv.captureStream(30);
 if(musicOn)stream.addTrack(dst.stream.getAudioTracks()[0]);
 const mt=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'';
 const ch=[];rec=new MediaRecorder(stream,mt?{mimeType:mt,videoBitsPerSecond:6e6}:{});
 rec.ondataavailable=e=>{if(e.data.size)ch.push(e.data)};
 rec.onstop=()=>{const ty=rec.mimeType||mt||'video/webm',ext=ty.includes('mp4')?'mp4':'webm',a=$('dl');
  a.href=URL.createObjectURL(new Blob(ch,{type:ty}));a.download='story.'+ext;a.textContent='⬇ Download video (.'+ext+')';a.style.display='inline-block';
  msg('Done! Tap the gold download button.');rec=null};
 rec.start();play();msg('Recording in real time... keep this screen open until it finishes.')};
requestAnimationFrame(tick);
</script></body></html>
